name: Maintenance UI navigation smoke

on:
  push:
    branches:
      - 'maintenance/**'
  pull_request:
    branches:
      - session3-stable
      - codex/blond-research-unified

permissions:
  contents: read

jobs:
  research-navigation:
    name: Research link safety (no evaluation changes)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - name: Syntax check
        run: node --check host_inference/ui/research_intelligence.js
      - name: Route regression tests
        run: node --test tests/js/research-navigation.test.mjs
