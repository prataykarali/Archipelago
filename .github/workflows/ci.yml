name: Archipelago CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  ARCHIPELAGO_ENV: "test"
  ARCHIPELAGO_AUTH_REQUIRED: "0"

jobs:
  # ─── Pass 1: Lint & Format ─────────────────────
  lint:
    name: "Pass 1 — Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - name: Ruff check
        run: ruff check archipelago/ src/ okf/ tests/
      - name: Ruff format check
        run: ruff format --check archipelago/ src/ okf/ tests/

  # ─── Pass 2: Type Check ────────────────────────
  typecheck:
    name: "Pass 2 — Type Check"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install mypy
      - name: Mypy strict check
        run: mypy archipelago/ okf/ src/ --ignore-missing-imports

  # ─── Pass 3: Quality Gate ──────────────────────
  quality-gate:
    name: "Pass 3 — Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff mypy
      - name: Run quality gate
        run: python scripts/quality_gate.py

  # ─── Unit Tests ────────────────────────────────
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-timeout pytest-cov
      - name: Run unit tests
        run: |
          pytest tests/unit/ -k "not test_heavy_gpu" -v \
            --timeout=60 --junitxml=test-results.xml \
            --cov=archipelago --cov=okf --cov-report=xml
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            test-results.xml
            coverage.xml

  # ─── Integration Tests ─────────────────────────
  integration-tests:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    needs: [unit-tests]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-timeout
      - name: Run integration tests
        run: pytest tests/integration/ -v --timeout=120 --junitxml=integration-results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: integration-results.xml

  # ─── Security Scanning ─────────────────────────
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit pip-audit
      - name: Bandit security scan
        run: |
          bandit -r archipelago/ okf/ chat_server.py graph_server.py \
            -s B101 -f json -o bandit-report.json || true
      - name: Dependency audit
        run: pip-audit --format=json --output=audit-report.json || true
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            audit-report.json

  # ─── Graph Integrity Validation ─────────────────
  graph-integrity:
    name: "Graph Integrity Check"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate graph integrity
        run: python scripts/validate_graph.py --json-report graph-integrity.json
      - name: Upload graph report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-integrity-report
          path: graph-integrity.json

  # ─── Docker Build Verification ──────────────────
  docker-build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: [unit-tests, graph-integrity]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -t archipelago-ci-test .
      - name: Verify image imports
        run: |
          docker run --rm archipelago-ci-test \
            python -c "from archipelago.apps.inference_app import create_app; print('OK')"
