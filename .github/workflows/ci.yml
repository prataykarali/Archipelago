name: Archipelago CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  ARCHIPELAGO_ENV: "test"
  ARCHIPELAGO_AUTH_REQUIRED: "0"

jobs:
  # ─── Pass 1: Lint & Format ─────────────────────
  lint:
    name: "Pass 1 — Lint & Format"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff
      - name: Ruff check
        run: ruff check archipelago/ okf/ chat_server/ graph_server.py tests/
      - name: Ruff format check
        run: ruff format --check archipelago/ okf/ chat_server/ tests/

  # ─── Pass 2: Type Check ────────────────────────
  typecheck:
    name: "Pass 2 — Type Check"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install mypy
      - name: Mypy strict check
        run: mypy archipelago/ okf/ --ignore-missing-imports

  # ─── Pass 3: Quality Gate ──────────────────────
  quality-gate:
    name: "Pass 3 — Quality Gate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install ruff mypy
      - name: Run quality gate
        run: python scripts/quality_gate.py

  # ─── Unit Tests ────────────────────────────────
  unit-tests:
    name: "Unit Tests"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-timeout pytest-cov
      - name: Run unit tests
        run: |
          pytest tests/unit/ -k "not test_heavy_gpu" -v \
            --timeout=60 --junitxml=test-results.xml \
            --cov=archipelago --cov=okf --cov-report=xml
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: |
            test-results.xml
            coverage.xml

  # ─── Integration Tests ─────────────────────────
  integration-tests:
    name: "Integration Tests"
    runs-on: ubuntu-latest
    needs: [unit-tests]
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest-timeout
      - name: Run integration tests
        run: pytest tests/integration/ -v --timeout=120 --junitxml=integration-results.xml
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: integration-results.xml

  # ─── Security Scanning ─────────────────────────
  security:
    name: "Security Scan"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install bandit pip-audit
      - name: Bandit security scan
        run: |
          bandit -r archipelago/ okf/ chat_server/ graph_server.py \
            -s B101 -f json -o bandit-report.json || true
      - name: Dependency audit
        run: pip-audit --format=json --output=audit-report.json || true
      - name: Upload security reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: security-reports
          path: |
            bandit-report.json
            audit-report.json

  # ─── Graph Integrity Validation ─────────────────
  graph-integrity:
    name: "Graph Integrity Check"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Validate graph integrity
        run: python scripts/validate_graph.py --json-report graph-integrity.json
      - name: Upload graph report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-integrity-report
          path: graph-integrity.json

  # ─── Docker Build Verification ──────────────────
  docker-build:
    name: "Docker Build"
    runs-on: ubuntu-latest
    needs: [unit-tests, graph-integrity]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build Docker image
        run: docker build -t archipelago-ci-test .
      - name: Verify image imports
        run: |
          docker run --rm archipelago-ci-test \
            python -c "from archipelago.apps.inference_app import create_app; print('OK')"

  # ─── Source Link Verification ──────────────────
  # Docs/01 §5, §20: every book, paper, and dataset mention must resolve to the
  # exact verified source page, never a generic homepage.
  source-links:
    name: "Source Link Verification"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify exact source links
        run: pytest tests/unit/test_source_links.py -v --timeout=120

  # ─── Librarian Intake ──────────────────────────
  # Mention-a-book, scanned page OCR, and idempotent spreadsheet merge.
  librarian-intake:
    name: "Librarian Intake"
    runs-on: ubuntu-latest
    needs: [lint]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Test intake helpers
        run: pytest tests/unit/test_ingestion_intake.py -v --timeout=120

  # ─── Secret Scan ───────────────────────────────
  secret-scan:
    name: "Secret Scan"
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Scan for committed credentials
        run: |
          pip install detect-secrets
          detect-secrets scan --all-files --baseline /dev/null \
            > /dev/null 2>&1 || true
          detect-secrets-hook --baseline .secrets.baseline --all-files \
            2>/dev/null || true
          # Xkiro and Supabase keys must never appear in tracked source.
          if git grep -nE "(XKIRO_API_KEY|SUPABASE_SERVICE_ROLE_KEY)[[:space:]]*=[[:space:]]*['\"][A-Za-z0-9_-]{16,}" \
               -- '*.py' '*.js' '*.html' ; then
            echo "::error::A credential literal is committed in source."
            exit 1
          fi
          echo "No committed credential literals found."

  # ─── Deployment Readiness ──────────────────────
  deployment-readiness:
    name: "Deployment Readiness"
    runs-on: ubuntu-latest
    needs: [unit-tests, source-links, librarian-intake, graph-integrity, docker-build]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Verify all three services build their apps
        env:
          ARCHIPELAGO_AUTH_REQUIRED: "0"
        run: |
          python -c "from archipelago.apps.inference_app import create_app as a; a(); print('inference OK')"
          python -c "import chat_server; print('chat OK')"
          python -c "import graph_server; print('graph OK')"
      - name: Verify readiness probe reports ready
        env:
          ARCHIPELAGO_AUTH_REQUIRED: "0"
        run: |
          python -c "
          from archipelago.apps.inference_app import create_app
          app = create_app()
          c = app.test_client()
          body = c.get('/api/readiness').get_json()
          assert body['ready'] is True, body
          assert c.get('/health').status_code == 200
          assert c.get('/ready').status_code == 200
          print('readiness OK:', body['graph']['concept_count'], 'concepts')
          "
      - name: Verify open reading works without a session
        env:
          ARCHIPELAGO_AUTH_REQUIRED: "1"
        run: |
          python -c "
          import chat_server
          c = chat_server.app.test_client()
          for path in ('/', '/chat', '/library'):
              assert c.get(path).status_code == 200, path
          assert c.get('/api/users').status_code == 401, 'user management must stay gated'
          print('open reading OK; staff endpoints gated')
          "
      - name: Summarise Definition of Done
        run: |
          {
            echo "### Archipelago deployment readiness"
            echo ""
            echo "| Gate | Status |"
            echo "| --- | --- |"
            echo "| Lint / format | pass |"
            echo "| Unit tests | pass |"
            echo "| Source links | pass |"
            echo "| Librarian intake | pass |"
            echo "| Graph integrity | pass |"
            echo "| Docker build | pass |"
            echo "| Open reading + gated staff APIs | pass |"
          } >> "$GITHUB_STEP_SUMMARY"
