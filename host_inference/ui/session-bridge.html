<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Archipelago session handoff</title><script type="module" src="/auth_bridge.js"></script></head><body style="font:16px system-ui;padding:24px"><p id="status" role="status">Connecting your Archipelago session…</p><script type="module">
  const params = new URLSearchParams(location.search);
  const requestedTarget = params.get('target');
  const requestedState = params.get('state') || '';
  const STATE_PATTERN = /^[A-Za-z0-9_-]{16,128}$/;
  let target = null;
  try {
    const candidate = new URL(requestedTarget);
    const referrer = document.referrer ? new URL(document.referrer) : null;
    const librarianHost = candidate.hostname === 'archipelago-librarian.vercel.app'
      || candidate.hostname === 'archipelago-blond.vercel.app'
      || /^archipelago-librarian-[a-z0-9-]+-shinaura\.vercel\.app$/.test(candidate.hostname);
    if (candidate.protocol === 'https:' && librarianHost && (!referrer || candidate.origin === referrer.origin)) {
      target = candidate.origin;
    }
  } catch (_) {}
  const status = document.getElementById('status');
  if (!window.opener || window.opener === window || !target || !STATE_PATTERN.test(requestedState)) {
    status.textContent = 'Open this from a verified Librarian Space sign-in page.';
  } else {
    try {
      const { supabase } = await window.archipelagoAuthReady;
      const { data } = await supabase.auth.getSession();
      if (!data.session?.access_token) throw new Error('Please sign in on the main Archipelago site first.');
      const response = await fetch('/api/auth/me', { cache: 'no-store' });
      if (!response.ok) throw new Error('Your Archipelago session needs to be verified.');
      const principal = await response.json();
      if (!['faculty','librarian','administrator'].includes(principal.role)) throw new Error('A staff account is required.');

      let payload = null;
      try {
        const ticketResp = await fetch('/api/auth/handoff-ticket', {
          method: 'POST',
          credentials: 'same-origin',
          headers: { 'Content-Type': 'application/json', 'X-Requested-With': 'XMLHttpRequest' },
          body: JSON.stringify({ target_origin: target, state: requestedState, nonce: requestedState }),
          cache: 'no-store',
        });
        if (ticketResp.ok) {
          const ticketData = await ticketResp.json();
          if (typeof ticketData?.ticket === 'string' && ticketData.ticket.length >= 16) {
            payload = { type: 'archipelago-session-v2', ticket: ticketData.ticket, state: requestedState };
          }
        }
      } catch (_) {}

      if (!payload) {
        // Fallback: never transmit raw refresh_token across window boundaries
        payload = { type: 'archipelago-session-v2', access_token: data.session.access_token, state: requestedState };
      }

      window.opener.postMessage(payload, target);
      status.textContent = 'Session verified. This window can be closed.';
      setTimeout(() => window.close(), 1200);
    } catch (error) {
      status.textContent = error.message || 'Session handoff failed.';
    }
  }
</script></body></html>
