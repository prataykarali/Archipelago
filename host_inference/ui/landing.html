<!DOCTYPE html>
<html lang="en" class="h-full bg-black">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Archipelago — Built for the Curious</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap');
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <script type="module" src="/auth_bridge.js"></script>

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-color: #000000;
      color: #ffffff;
      margin: 0;
      padding: 0;
      overflow: hidden;
      user-select: none;
    }

    .font-serif-title {
      font-family: 'Instrument Serif', serif !important;
    }

    /* Liquid Glass CSS */
    .liquid-glass {
      background: rgba(255, 255, 255, 0.01);
      background-blend-mode: luminosity;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      border: none;
      box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
    }

    .liquid-glass::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: inherit;
      padding: 1.4px;
      background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      pointer-events: none;
    }
  </style>
</head>
<body class="min-h-screen bg-black text-white relative overflow-hidden flex flex-col justify-between">

  <!-- Full-screen Looping Background Video (shifted down 17%) -->
  <div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
    <video
      id="bg-hero-video"
      src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_115001_bcdaa3b4-03de-47e7-ad63-ae3e392c32d4.mp4"
      autoplay
      loop
      muted
      playsinline
      class="absolute inset-0 w-full h-full object-cover translate-y-[17%] opacity-0"
    ></video>
    <div class="absolute inset-0 bg-gradient-to-b from-black/40 via-transparent to-black/80"></div>
  </div>

  <!-- Layout Container: Navigation Bar -->
  <header class="relative z-20 pl-6 pr-6 py-6">
    <nav class="liquid-glass rounded-full px-6 py-3 flex items-center justify-between max-w-5xl mx-auto">
      <!-- Left Side: Logo & Links -->
      <div class="flex items-center gap-8">
        <a href="/" class="flex items-center gap-2 text-white font-semibold text-lg text-decoration-none">
          <i data-lucide="globe" class="w-6 h-6 text-white"></i>
          <span>Asme</span>
        </a>
        <div class="hidden md:flex items-center gap-6">
          <a href="/library" class="text-white/80 hover:text-white transition-colors text-sm font-medium text-decoration-none">Library</a>
          <a href="/library#sec-access" class="text-white/80 hover:text-white transition-colors text-sm font-medium text-decoration-none">Pricing</a>
          <a href="/library#sec-overview" class="text-white/80 hover:text-white transition-colors text-sm font-medium text-decoration-none">About</a>
        </div>
      </div>

      <!-- Right Side: Auth & Options Buttons -->
      <div class="flex items-center gap-4">
        <button onclick="openAuthModal('signup')" class="text-white/90 hover:text-white text-sm font-medium bg-transparent border-0 cursor-pointer">
          Sign Up
        </button>
        <button onclick="openAuthModal('login')" class="liquid-glass rounded-full px-6 py-2 text-sm font-medium text-white cursor-pointer hover:bg-white/5 transition-all">
          Login
        </button>
      </div>
    </nav>
  </header>

  <!-- Hero Content Area -->
  <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-12 text-center -translate-y-[10%] max-w-4xl mx-auto">
    <h1 class="font-serif-title text-5xl md:text-6xl lg:text-7xl text-white mb-8 tracking-tight whitespace-nowrap">
      Built for the curious
    </h1>

    <div class="max-w-xl w-full space-y-5">
      <!-- Email Input Bar -->
      <form onsubmit="handleSubscribe(event)" class="liquid-glass rounded-full pl-6 pr-2 py-2 flex items-center gap-3">
        <input
          type="email"
          required
          placeholder="Enter your email"
          class="bg-transparent border-0 flex-1 text-white placeholder:text-white/40 text-base focus:outline-none"
        />
        <button type="submit" class="bg-white rounded-full p-3 text-black border-0 cursor-pointer hover:bg-white/90 transition-transform hover:scale-105 flex items-center justify-center">
          <i data-lucide="arrow-right" class="w-5 h-5"></i>
        </button>
      </form>

      <!-- Subtitle Text -->
      <p class="text-white text-sm leading-relaxed px-4">
        Stay updated with the latest news and insights. Subscribe to our newsletter today and never miss out on exciting updates.
      </p>

      <!-- CTA Buttons to Enter Chat or Library Details Page -->
      <div class="pt-2 flex items-center justify-center gap-4">
        <button type="button" onclick="handleEnterAction('/chat')" class="liquid-glass rounded-full px-7 py-3 text-white text-sm font-medium hover:bg-white/10 transition-colors text-decoration-none cursor-pointer border-0">
          Enter the Chat &rarr;
        </button>
        <button type="button" onclick="handleEnterAction('/library')" class="liquid-glass rounded-full px-7 py-3 text-white text-sm font-medium hover:bg-white/10 transition-colors text-decoration-none cursor-pointer border-0">
          Library Details &rarr;
        </button>
      </div>
    </div>
  </main>

  <!-- Social Icons Footer -->
  <footer class="relative z-10 flex justify-center gap-4 pb-12">
    <a href="#" aria-label="Instagram" class="liquid-glass rounded-full p-4 text-white/80 hover:text-white hover:bg-white/5 transition-all flex items-center justify-center">
      <i data-lucide="instagram" class="w-5 h-5"></i>
    </a>
    <a href="#" aria-label="Twitter" class="liquid-glass rounded-full p-4 text-white/80 hover:text-white hover:bg-white/5 transition-all flex items-center justify-center">
      <i data-lucide="twitter" class="w-5 h-5"></i>
    </a>
    <a href="#" aria-label="Globe" class="liquid-glass rounded-full p-4 text-white/80 hover:text-white hover:bg-white/5 transition-all flex items-center justify-center">
      <i data-lucide="globe" class="w-5 h-5"></i>
    </a>
  </footer>

  <!-- Role-Based Auth Popup Modal -->
  <div id="auth-modal" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-md flex items-center justify-center p-4">
    <div class="liquid-glass rounded-3xl p-8 max-w-md w-full bg-zinc-950/95 text-left border border-white/20 shadow-2xl relative">
      <div class="flex items-center justify-between border-b border-white/10 pb-4 mb-4">
        <h3 id="auth-modal-title" class="text-xl font-bold text-white flex items-center gap-2">
          <i data-lucide="shield-check" class="w-5 h-5 text-purple-400"></i>
          <span>Sign In to Archipelago</span>
        </h3>
        <button type="button" onclick="closeAuthModal()" class="text-white/60 hover:text-white bg-transparent border-0 cursor-pointer text-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <!-- Quick 1-Click Access -->
      <div class="mb-4 pb-4 border-b border-white/10">
        <p class="text-xs text-white/50 mb-2 font-mono uppercase tracking-wider">Quick 1-Click Access</p>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="doLandingQuickLogin('student', '12024002028038')" class="px-3 py-2 rounded-xl bg-purple-500/20 hover:bg-purple-500/35 border border-purple-500/40 text-purple-200 text-xs font-semibold flex items-center justify-center gap-1.5 cursor-pointer transition-all">
            <span>🎓 Student</span>
          </button>
          <button type="button" onclick="doLandingQuickLogin('faculty', 'faculty.cs')" class="px-3 py-2 rounded-xl bg-amber-500/20 hover:bg-amber-500/35 border border-amber-500/40 text-amber-200 text-xs font-semibold flex items-center justify-center gap-1.5 cursor-pointer transition-all">
            <span>🏛️ Faculty</span>
          </button>
          <button type="button" onclick="doLandingQuickLogin('librarian', 'librarian')" class="px-3 py-2 rounded-xl bg-emerald-500/20 hover:bg-emerald-500/35 border border-emerald-500/40 text-emerald-200 text-xs font-semibold flex items-center justify-center gap-1.5 cursor-pointer transition-all">
            <span>📚 Librarian</span>
          </button>
          <button type="button" onclick="doLandingQuickLogin('administrator', 'administrator')" class="px-3 py-2 rounded-xl bg-pink-500/20 hover:bg-pink-500/35 border border-pink-500/40 text-pink-200 text-xs font-semibold flex items-center justify-center gap-1.5 cursor-pointer transition-all">
            <span>⚡ Admin</span>
          </button>
        </div>
      </div>

      <form id="landing-auth-form" onsubmit="handleLandingAuthSubmit(event)" class="space-y-3">
        <div>
          <label class="block text-[11px] font-mono text-white/60 mb-1 uppercase">Account Type</label>
          <select id="modal-role" class="w-full px-3 py-2 rounded-xl bg-zinc-900 border border-white/20 text-white text-xs focus:outline-none focus:border-purple-400">
            <option value="student">Student (Chat & Library)</option>
            <option value="faculty">Faculty (Chat & Library)</option>
            <option value="librarian">Librarian (Full Access)</option>
            <option value="administrator">Administrator (Full Access)</option>
          </select>
        </div>

        <div>
          <label class="block text-[11px] font-mono text-white/60 mb-1 uppercase">Username or Email</label>
          <input type="text" id="modal-username" required placeholder="12024002028038 or user@uem.edu.in" class="w-full px-3 py-2 rounded-xl bg-zinc-900 border border-white/20 text-white text-xs focus:outline-none focus:border-purple-400 placeholder-white/30" />
        </div>

        <div>
          <label class="block text-[11px] font-mono text-white/60 mb-1 uppercase">Password</label>
          <input type="password" id="modal-password" required placeholder="••••••••" class="w-full px-3 py-2 rounded-xl bg-zinc-900 border border-white/20 text-white text-xs focus:outline-none focus:border-purple-400 placeholder-white/30" />
        </div>

        <div id="modal-auth-msg" class="text-xs text-rose-400 min-h-[16px]"></div>

        <button type="submit" id="modal-submit-btn" class="w-full py-2.5 bg-gradient-to-r from-purple-600 to-pink-600 hover:from-purple-500 hover:to-pink-500 text-white font-semibold text-xs rounded-xl cursor-pointer transition-all shadow-md">
          Sign In & Access &rarr;
        </button>
      </form>

      <div class="mt-3 text-center">
        <a id="modal-full-login-link" href="/login" class="text-[11px] text-white/50 hover:text-white/80 transition-colors">
          Go to full login page &rarr;
        </a>
      </div>
    </div>
  </div>

  <script>
    if (window.lucide) lucide.createIcons();

    // Custom requestAnimationFrame-based Video Fade System (500ms fade-in/fade-out)
    const video = document.getElementById('bg-hero-video');
    let currentAnimFrame = null;
    let fadingOut = false;

    function fadeToOpacity(targetOpacity, durationMs, callback) {
      if (currentAnimFrame) cancelAnimationFrame(currentAnimFrame);
      const startOpacity = parseFloat(video.style.opacity || 0);
      const startTime = performance.now();

      function step(now) {
        const elapsed = now - startTime;
        const progress = Math.min(elapsed / durationMs, 1);
        const currentOpacity = startOpacity + (targetOpacity - startOpacity) * progress;
        video.style.opacity = currentOpacity;

        if (progress < 1) {
          currentAnimFrame = requestAnimationFrame(step);
        } else if (callback) {
          callback();
        }
      }
      currentAnimFrame = requestAnimationFrame(step);
    }

    video.addEventListener('play', () => {
      fadingOut = false;
      fadeToOpacity(1, 500);
    });

    video.addEventListener('timeupdate', () => {
      if (video.duration && (video.duration - video.currentTime <= 0.55) && !fadingOut) {
        fadingOut = true;
        fadeToOpacity(0, 500);
      }
    });

    video.addEventListener('ended', () => {
      video.style.opacity = 0;
      setTimeout(() => {
        video.currentTime = 0;
        fadingOut = false;
        video.play();
      }, 100);
    });

    // Session status comes only from the verified server principal.
    async function hasActiveSession() {
      try {
        const response = await fetch("/api/auth/me", { cache: "no-store" });
        if (!response.ok) return false;
        const principal = await response.json();
        return principal.authenticated === true;
      } catch (_) {
        return false;
      }
    }

    let targetDestination = "/chat";

    async function handleEnterAction(targetUrl) {
      targetDestination = targetUrl;
      if (await hasActiveSession()) {
        window.location.assign(targetUrl);
      } else {
        openAuthModal('login', targetUrl);
      }
    }

    function openAuthModal(mode, target = "/chat") {
      targetDestination = target;
      const fullLoginLink = document.getElementById("modal-full-login-link");
      if (fullLoginLink) {
        fullLoginLink.href = `/login?next=${encodeURIComponent(targetDestination)}`;
      }
      const modal = document.getElementById('auth-modal');
      if (modal) modal.classList.remove('hidden');
    }

    function closeAuthModal() {
      const modal = document.getElementById('auth-modal');
      if (modal) modal.classList.add('hidden');
    }


    function doLandingQuickLogin(role, username) {
      const roleEl = document.getElementById("modal-role");
      const userEl = document.getElementById("modal-username");
      const msg = document.getElementById("modal-auth-msg");
      if (roleEl) roleEl.value = role;
      if (userEl) userEl.value = username;
      if (msg) {
        msg.textContent = "Account type and username are filled. Type the password that was set for this account.";
      }
      const passwordEl = document.getElementById("modal-password");
      if (passwordEl) passwordEl.focus();
    }

    async function handleLandingAuthSubmit(e) {
      e.preventDefault();
      const msg = document.getElementById("modal-auth-msg");
      const role = document.getElementById("modal-role").value;
      const username = document.getElementById("modal-username").value.trim();
      const password = document.getElementById("modal-password").value;

      if (!username) {
        if (msg) msg.textContent = "Please enter your username or email.";
        return;
      }
      if (/^\d{8,}$/.test(username) && role !== "student") {
        if (msg) msg.textContent = "That enrollment number is a student account. Choose Student, not " + role + ".";
        return;
      }

      if (msg) msg.textContent = "Authenticating...";

      try {
        const { config, supabase } = await window.archipelagoAuthReady;
        if (!config?.configured || !supabase) throw new Error("Supabase sign-in is not configured.");
        const email = username.includes("@") ? username : `${username.toLowerCase()}@${role}.iem.archipelago.invalid`;
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });
        if (error || !data?.session) throw new Error(error?.message || "Invalid username, account type, or password.");
        const sessionResponse = await fetch("/api/auth/session", {
          method: "POST",
          headers: { Authorization: `Bearer ${data.session.access_token}` },
          credentials: "same-origin",
        });
        if (!sessionResponse.ok) throw new Error("Could not establish an authenticated session.");
        window.location.assign(targetDestination);
      } catch (err) {
        if (msg) msg.textContent = err?.message || "Sign-in failed. Please try again.";
      }
    }

    function handleSubscribe(e) {
      e.preventDefault();
      openAuthModal('signup', '/chat');
    }

    // Mount nav if user is already logged in
    window.archipelagoAuthReady?.then(async () => {
      if (window.archipelagoMountNavigation && await hasActiveSession()) {
        window.archipelagoMountNavigation();
      }
    });

    // Auto-prompt login popup on landing page whenever user is NOT logged in
    async function promptLoginIfNotAuthenticated() {
      if (!(await hasActiveSession())) {
        openAuthModal('login', '/chat');
      }
    }

    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', () => setTimeout(promptLoginIfNotAuthenticated, 400));
    } else {
      setTimeout(promptLoginIfNotAuthenticated, 400);
    }
  </script>
</body>
</html>
