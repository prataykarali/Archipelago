<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Choose your password — Archipelago</title>
  <style>
    body { align-items:center; background:#090514; color:#f8fafc; display:flex; font:15px system-ui,sans-serif; justify-content:center; margin:0; min-height:100vh; }
    main { background:#171126; border:1px solid #43345f; border-radius:20px; max-width:420px; padding:32px; width:calc(100% - 40px); }
    h1 { margin:0 0 8px; font-size:24px; }
    p { color:#cbd5e1; line-height:1.5; }
    label,input,button { box-sizing:border-box; display:block; width:100%; }
    label { margin:16px 0 6px; }
    input { background:#0d0a16; border:1px solid #67518b; border-radius:10px; color:#fff; padding:12px; }
    button { background:#8b5cf6; border:0; border-radius:10px; color:#fff; cursor:pointer; font-weight:700; margin-top:20px; padding:12px; }
    #message { min-height:20px; color:#fda4af; margin-top:12px; }
  </style>
  <script type="module" src="/auth_bridge.js"></script>
</head>
<body>
  <main>
    <h1>Choose your own password</h1>
    <p>Your initial enrollment password is temporary. Set a unique password before using your account.</p>
    <form id="change-form">
      <label for="new-password">New password</label>
      <input id="new-password" type="password" autocomplete="new-password" minlength="12" required>
      <label for="confirm-password">Confirm new password</label>
      <input id="confirm-password" type="password" autocomplete="new-password" minlength="12" required>
      <div id="message" role="status" aria-live="polite"></div>
      <button type="submit">Save password</button>
    </form>
  </main>
  <script type="module">
    const form = document.querySelector("#change-form");
    const message = document.querySelector("#message");
    const { supabase } = await window.archipelagoAuthReady;
    const { data } = await supabase?.auth.getSession() || {};
    if (!data?.session) window.location.replace("/login");
    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const password = document.querySelector("#new-password").value;
      if (password !== document.querySelector("#confirm-password").value) {
        message.textContent = "The passwords do not match.";
        return;
      }
      const button = form.querySelector("button");
      button.disabled = true;
      try {
        const response = await fetch("/api/auth/change-password", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ new_password: password }),
        });
        const result = await response.json();
        if (!response.ok) throw new Error(result.detail || "Could not save your password.");
        try { await supabase.auth.signOut(); } catch (_) { /* Session may be invalid after rotation. */ }
        try { await fetch("/api/auth/session", { method: "DELETE", credentials: "same-origin" }); } catch (_) { /* New login will replace the cookie. */ }
        window.location.replace("/login");
      } catch (error) {
        message.textContent = error.message || "Could not save your password.";
        button.disabled = false;
      }
    });
  </script>
</body>
</html>
