<!DOCTYPE html>
<html lang="en" class="h-full bg-black">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asme — Built for the curious</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', sans-serif;
            overflow-x: hidden;
        }

        .font-instrument {
            font-family: 'Instrument Serif', serif !important;
        }

        /* Liquid Glass CSS (.liquid-glass class) */
        .liquid-glass {
            background: rgba(255, 255, 255, 0.01) !important;
            background-blend-mode: luminosity !important;
            backdrop-filter: blur(4px) !important;
            -webkit-backdrop-filter: blur(4px) !important;
            border: none !important;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.1) !important;
            position: relative;
            overflow: hidden;
        }

        .liquid-glass::before {
            content: '';
            position: absolute;
            inset: 0;
            border-radius: inherit;
            padding: 1.4px;
            background: linear-gradient(180deg, rgba(255,255,255,0.45) 0%, rgba(255,255,255,0.15) 20%, rgba(255,255,255,0) 40%, rgba(255,255,255,0) 60%, rgba(255,255,255,0.15) 80%, rgba(255,255,255,0.45) 100%);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            pointer-events: none;
        }
    </style>
</head>
<body class="min-h-screen bg-black overflow-hidden flex flex-col justify-between relative selection:bg-white selection:text-black">

    <!-- Full-screen Looping Background Video -->
    <video
        id="bg-video"
        autoplay
        loop
        muted
        playsinline
        preload="auto"
        class="absolute inset-0 w-full h-full object-cover translate-y-[17%] pointer-events-none"
        style="opacity: 0;"
        src="https://d8j0ntlcm91z4.cloudfront.net/user_38xzZboKViGWJOttwIXH07lWA1P/hf_20260328_115001_bcdaa3b4-03de-47e7-ad63-ae3e392c32d4.mp4"
    ></video>

    <!-- Navigation Bar -->
    <header class="relative z-20 pl-6 pr-6 py-6 w-full">
        <nav class="liquid-glass rounded-full px-6 py-3 flex items-center justify-between max-w-5xl mx-auto w-full shadow-2xl">
            <!-- Left Side: Logo + Nav Links -->
            <div class="flex items-center gap-8">
                <a href="/" class="flex items-center gap-2 text-white group">
                    <i data-lucide="globe" class="w-6 h-6 text-white group-hover:rotate-45 transition-transform duration-500"></i>
                    <span class="font-semibold text-lg tracking-tight text-white">Asme</span>
                </a>

                <!-- Nav links (hidden on mobile, shown on md:) -->
                <div class="hidden md:flex items-center gap-8 text-sm font-medium">
                    <a href="/chat" class="text-white/80 hover:text-white transition-colors">Features</a>
                    <a href="/library" class="text-white/80 hover:text-white transition-colors">Pricing</a>
                    <a href="/library#portals" class="text-white/80 hover:text-white transition-colors">About</a>
                </div>
            </div>

            <!-- Right Side: Sign Up + Login -->
            <div class="flex items-center gap-4 text-sm font-medium">
                <a href="/login" class="text-white/90 hover:text-white transition-colors font-medium">
                    Sign Up
                </a>
                <a href="/login" class="liquid-glass rounded-full px-6 py-2 text-white hover:bg-white/10 transition-colors font-medium">
                    Login
                </a>
            </div>
        </nav>
    </header>

    <!-- Hero Content Area -->
    <main class="relative z-10 flex-1 flex flex-col items-center justify-center px-6 py-12 text-center -translate-y-[20%] max-w-4xl mx-auto w-full">
        <!-- Main Heading -->
        <h1 class="font-instrument text-5xl md:text-6xl lg:text-7xl text-white mb-8 tracking-tight whitespace-nowrap drop-shadow-md" style="font-family: 'Instrument Serif', serif;">
            Built for the curious
        </h1>

        <!-- Email input bar container -->
        <div class="max-w-xl w-full space-y-4">
            <form id="subscribe-form" onsubmit="handleSubscribe(event)" class="liquid-glass rounded-full pl-6 pr-2 py-2 flex items-center gap-3 shadow-2xl transition-all focus-within:ring-1 focus-within:ring-white/40">
                <input
                    type="email"
                    id="email-input"
                    required
                    placeholder="Enter your email"
                    class="bg-transparent text-white placeholder:text-white/40 text-base outline-none flex-1 font-normal w-full"
                    autocomplete="email"
                />
                <button
                    type="submit"
                    aria-label="Submit"
                    class="bg-white rounded-full p-3 text-black hover:scale-105 active:scale-95 transition-transform flex items-center justify-center cursor-pointer shadow-md"
                >
                    <i data-lucide="arrow-right" class="w-5 h-5 text-black stroke-[2.5]"></i>
                </button>
            </form>

            <p class="text-white text-sm leading-relaxed px-4">
                Stay updated with the latest news and insights. Subscribe to our newsletter today and never miss out on exciting updates.
            </p>

            <div class="pt-1 flex justify-center">
                <a
                    href="/chat"
                    class="liquid-glass rounded-full px-8 py-3 text-white text-sm font-medium hover:bg-white/5 transition-colors cursor-pointer inline-block"
                >
                    Manifesto
                </a>
            </div>
        </div>
    </main>

    <!-- Social Icons Footer -->
    <footer class="relative z-10 flex justify-center gap-4 pb-12 w-full">
        <a
            href="https://instagram.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Instagram"
            class="liquid-glass rounded-full p-4 text-white/80 hover:text-white hover:bg-white/5 transition-all flex items-center justify-center"
        >
            <i data-lucide="instagram" class="w-5 h-5"></i>
        </a>
        <a
            href="https://twitter.com"
            target="_blank"
            rel="noopener noreferrer"
            aria-label="Twitter"
            class="liquid-glass rounded-full p-4 text-white/80 hover:text-white hover:bg-white/5 transition-all flex items-center justify-center"
        >
            <i data-lucide="twitter" class="w-5 h-5"></i>
        </a>
        <a
            href="/library"
            aria-label="Globe"
            class="liquid-glass rounded-full p-4 text-white/80 hover:text-white hover:bg-white/5 transition-all flex items-center justify-center"
        >
            <i data-lucide="globe" class="w-5 h-5"></i>
        </a>
    </footer>

    <!-- Video Fade Loop Engine & Interactions -->
    <script>
        lucide.createIcons();

        // Video JavaScript 500ms RAF fade loop engine
        (function initVideoFadeEngine() {
            const video = document.getElementById("bg-video");
            if (!video) return;

            let animFrameId = null;
            let fadingOutRef = false;
            const FADE_DURATION = 500;

            function getCurrentOpacity() {
                const op = parseFloat(window.getComputedStyle(video).opacity);
                return isNaN(op) ? 0 : op;
            }

            function fadeTo(targetOpacity, duration, callback) {
                if (animFrameId) {
                    cancelAnimationFrame(animFrameId);
                    animFrameId = null;
                }

                const startOpacity = getCurrentOpacity();
                const startTime = performance.now();

                function step(currentTime) {
                    const elapsed = currentTime - startTime;
                    const progress = Math.min(elapsed / duration, 1);
                    const newOpacity = startOpacity + (targetOpacity - startOpacity) * progress;
                    video.style.opacity = newOpacity;

                    if (progress < 1) {
                        animFrameId = requestAnimationFrame(step);
                    } else {
                        animFrameId = null;
                        if (callback) callback();
                    }
                }

                animFrameId = requestAnimationFrame(step);
            }

            function startPlayAndFadeIn() {
                fadingOutRef = false;
                const playPromise = video.play();
                if (playPromise !== undefined) {
                    playPromise
                        .then(() => {
                            fadeTo(1, FADE_DURATION);
                        })
                        .catch((err) => {
                            console.warn("Autoplay with sound prevented, muting and retrying:", err);
                            video.muted = true;
                            video.play().then(() => fadeTo(1, FADE_DURATION)).catch(e => console.error("Video play error:", e));
                        });
                }
            }

            video.addEventListener("error", (e) => {
                console.error("Background video failed to load:", e);
            });

            video.addEventListener("loadeddata", () => {
                startPlayAndFadeIn();
            });

            video.addEventListener("timeupdate", () => {
                if (!video.duration || isNaN(video.duration)) return;
                const timeLeft = video.duration - video.currentTime;
                // 500ms fade-out when 0.55 seconds remain before the video ends
                if (timeLeft <= 0.55 && !fadingOutRef) {
                    fadingOutRef = true;
                    fadeTo(0, FADE_DURATION);
                }
            });

            video.addEventListener("ended", () => {
                video.style.opacity = 0;
                setTimeout(() => {
                    video.currentTime = 0;
                    startPlayAndFadeIn();
                }, 100);
            });

            if (video.readyState >= 2) {
                startPlayAndFadeIn();
            }
        })();

        function handleSubscribe(e) {
            e.preventDefault();
            const input = document.getElementById("email-input");
            const email = (input ? input.value : "").trim();
            if (email) {
                alert("Thank you for subscribing to Asme!");
                input.value = "";
            }
        }
    </script>
</body>
</html>
