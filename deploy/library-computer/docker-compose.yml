# Archipelago Library Computer — Self-Contained Docker Stack
#
# This stack runs on the institution's library/IEDC computer and owns the
# institutional knowledge state: ingestion, graph, library index.
#
# Usage:
#   cp .env.example .env        # then fill in credentials
#   docker compose up -d --build
#   docker compose ps           # wait for archipelago-ingestion to be healthy
#
# The library computer must NOT send the corpus to the hosted inference API. It
# indexes institutional knowledge locally and sends only minimal retrieval
# context.
#
# Portability notes (these are load-bearing, not decoration):
#   * Every long-running command is a real entrypoint module, never an inline
#     `python -c`. Inline commands cannot be linted, tested, or given a
#     healthcheck.
#   * The model is mounted from the host (`${ARCHIPELAGO_MODEL_DIR}`) rather
#     than a named volume. A named volume starts empty, so the container would
#     silently fall back to a default model path.
#   * Ollama runs as a sibling service so the appliance is air-gap capable.
#     Point ARCHIPELAGO_OLLAMA_HOST at an external daemon instead if the
#     library already has one.

name: archipelago-library

services:
  # ─── Ollama (local SLM) ────────────────────────
  # Kept in the stack so the library computer needs no internet for ingestion.
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama:/root/.ollama
    # Detached: nothing in the stack talks to the Ollama HTTP API directly.
    expose:
      - "11434"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ─── Ingestion Worker ──────────────────────────
  archipelago-ingestion:
    build:
      context: ../..
      dockerfile: Dockerfile
    # Real entrypoint: starts the queue worker and blocks. Swappable for a
    # debug shell with `docker compose run --rm --entrypoint bash
    # archipelago-ingestion`.
    entrypoint: ["python", "scripts/run_ingestion_worker.py"]
    volumes:
      # The graph database is a directory volume: KùzuDB is a directory, not a
      # single file, so a file mount silently hides the catalog.
      - graph-data:/app/okf_graph.db
      - graph-json:/app/graph-state
      - pdfs:/app/pdfs
      - jobs:/app/jobs
      # Host model directory, read-only. See portability note above.
      - ${ARCHIPELAGO_MODEL_DIR:-../../models}:/app/models:ro
      # Institutional state that travels with the corpus: the source-lifecycle
      # ledger and the librarian ingest-proposal queue. Mounted as a bind (not
      # a named volume) so `docker compose down` never silently discards which
      # sources were withdrawn.
      - ${ARCHIPELAGO_STATE_DIR:-../../data}:/app/data
    env_file:
      - ${ARCHIPELAGO_LIBRARY_ENV_FILE:-.env}
    environment:
      ARCHIPELAGO_ENV: "library"
      ARCHIPELAGO_OLLAMA_HOST: "http://ollama:11434"
      ARCHIPELAGO_STATE_DIR: "/app"
      OKF_LOCAL_MODEL: "/app/models/lib_qwen_v44_hf"
      ARCHIPELAGO_BIND: "0.0.0.0"
      JSON_PATH: "/app/graph-state/okf_graph.json"
      ARCHIPELAGO_GRAPH_JSON: "/app/graph-state/okf_graph.json"
    depends_on:
      ollama:
        condition: service_healthy
    # Liveness only: never let a missing model trigger a restart loop.
    healthcheck:
      test: ["CMD", "python", "scripts/worker_health.py", "liveness", "/app/jobs"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 45s
    restart: unless-stopped

  # ─── Graph Server ──────────────────────────────
  archipelago-graph:
    build:
      context: ../..
      dockerfile: Dockerfile
    command:
      - gunicorn
      - --bind=0.0.0.0:5150
      - --workers=1
      - --threads=4
      - --timeout=120
      - --access-logfile=-
      - --error-logfile=-
      - graph_server:app
    ports:
      - "127.0.0.1:5150:5150"
    volumes:
      - graph-json:/app/graph-state:ro
      - ../../ui:/app/ui:ro
      - ../../buttons:/app/buttons:ro
    env_file:
      - ${ARCHIPELAGO_LIBRARY_ENV_FILE:-.env}
    environment:
      PORT: "5150"
      ARCHIPELAGO_GRAPH_PORT: "5150"
      ARCHIPELAGO_GRAPH_JSON: "/app/graph-state/okf_graph.json"
      ARCHIPELAGO_AUTH_REQUIRED: "1"
      ARCHIPELAGO_ALLOWED_ORIGIN: "https://archipelago.antideploy.com"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:5150/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    depends_on:
      archipelago-ingestion:
        condition: service_healthy
    restart: unless-stopped

  # ─── Sync Service ──────────────────────────────
  # Reports graph size to the hosted API every SYNC_INTERVAL_SEC.
  archipelago-sync:
    build:
      context: ../..
      dockerfile: Dockerfile
    entrypoint: ["python", "scripts/run_sync_service.py"]
    volumes:
      - graph-json:/app/graph-state:ro
    env_file:
      - ${ARCHIPELAGO_LIBRARY_ENV_FILE:-.env}
    environment:
      SYNC_INTERVAL_SEC: "300"
      ARCHIPELAGO_GRAPH_JSON: "/app/graph-state/okf_graph.json"
    healthcheck:
      test: ["CMD", "python", "scripts/worker_health.py", "liveness", "/tmp"]
      interval: 60s
      timeout: 15s
      retries: 3
    depends_on:
      - archipelago-graph
    restart: unless-stopped

volumes:
  # KùzuDB database directory (catalog tables + concept graph).
  graph-data:
  # okf_graph.json export consumed by the graph UI and the hosted API.
  graph-json:
  pdfs:
  jobs:
  ollama:
